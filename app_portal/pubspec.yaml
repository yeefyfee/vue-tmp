name: app_portal
description: "App 大门户 — 功能聚合入口，内置个人物品收纳模块"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # 网络
  dio: ^5.7.0

  # 数据模型
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # 本地存储
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI / 工具
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  equatable: ^2.0.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
