# =============================================================================
# vue3-element-admin 生产环境 Nginx 配置
#
# 作用：
#   1. 托管前端构建产物 dist/
#   2. 把 /prod-api 反向代理到后端，并剥掉该前缀
#      （开发环境由 Vite server.proxy 做这件事，构建后必须由 Nginx 接管）
#
# 放置位置：/etc/nginx/conf.d/vea-admin.conf
#
# 使用前请替换以下占位内容：
#   1. server_name             → 你的前端域名
#   2. ssl_certificate(_key)   → 你的证书路径（或用 certbot 自动签发）
#   3. root                    → 前端 dist 实际部署目录
#   4. rewrite / proxy_pass   → 后端地址，默认 https://api.theobuild.top（不带尾斜杠）
#
# 生效命令：
#   nginx -t && nginx -s reload
#
# 验证反代是否真的生效（从服务器本机执行）：
#   curl -i https://你的域名/prod-api/api/v1/auth/captcha
#     返回 200 且 code=00000  → 正常
#     返回 404 C0113 接口不存在 → 前缀没被剥掉，检查 rewrite / proxy_pass 是否生效
#     返回 404 且是 HTML        → 反代规则没命中，请求被 SPA 兜底吃掉了
#     返回 502 / SSL 错误       → proxy_ssl_server_name 未开
#
#   不登录服务器也能自查：浏览器打开 https://你的域名/prod-apixyz
#     若它「也」返回后端 JSON（C0113），说明生效的 location 是 `^~ /prod-api`（无尾斜杠）
#     且 proxy_pass 不带 URI —— 即前缀不会被剥掉，本节配置没有真正生效。
# =============================================================================

# HTTP 跳转 HTTPS（若前端也走 Cloudflare 全站 HTTPS，可保留或删除）
server {
    listen      80;
    listen      [::]:80;
    server_name admin.example.com;      # ← 替换为你的前端域名

    return 301 https://$host$request_uri;
}

server {
    # Nginx 1.25.1+ 使用 http2 指令；旧版本请改为：listen 443 ssl http2;
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name admin.example.com;      # ← 替换为你的前端域名

    # ---------- 证书 ----------
    ssl_certificate     /etc/nginx/ssl/admin.example.com.pem;   # ← 替换
    ssl_certificate_key /etc/nginx/ssl/admin.example.com.key;   # ← 替换
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 前端静态站点 ----------
    # 注意：构建产物 index.html 引用的是绝对路径 /js/... /css/...，
    #       因此前端必须部署在「域名根路径」，不能放到子目录（如 /admin/）。
    root  /var/www/vue3-element-admin/dist;   # ← 替换为实际目录
    index index.html;

    client_max_body_size 50m;           # 文件上传接口所需

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的静态资源，可长期强缓存
    location ~* ^/(js|css|images|img|fonts|media)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后能立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 回退。本项目路由为 hash 模式（createWebHashHistory），真实地址是 /#/system/user，
    # 服务器只会看到 /，所以当前并非必需；若将来改用 history 模式则必须保留这段。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 接口反向代理：/prod-api/  →  后端 /api/v1/...
    # =========================================================================
    #
    # 【最关键的一点】前缀必须被剥掉，两种写法二选一（不要混用）：
    #
    #   写法 1（依赖 proxy_pass 的尾斜杠，简洁但易踩坑）：
    #       location /prod-api/ { proxy_pass https://api.theobuild.top/; }
    #       带斜杠 → /prod-api/api/v1/auth/login 转发成 /api/v1/auth/login  ✓
    #       漏斜杠 → 原样转发 /prod-api/api/v1/auth/login  → 404 C0113       ✗
    #
    #   写法 2（下面采用的：显式 rewrite，不依赖尾斜杠，推荐）：
    #       proxy_pass 故意不带 URI，靠 rewrite 改写请求路径后转发。
    #       好处：面板/表单把目标地址里的尾斜杠抹掉也不影响结果。
    #             （1Panel 的反向代理表单保存时会按字段重新生成配置，手补的斜杠会被覆盖）
    #
    location ^~ /prod-api/ {
        # 显式剥掉 /prod-api 前缀
        rewrite ^/prod-api/(.*)$ /$1 break;

        # ↓ 注意：这里故意不带结尾斜杠（配合上面的 rewrite）
        #   若前端与后端部署在同一台服务器，改为：proxy_pass http://127.0.0.1:8000;
        #   （直连源站比绕一圈公网更稳、更快，也不受 Cloudflare 超时影响）
        proxy_pass https://api.theobuild.top;

        proxy_http_version 1.1;

        # Cloudflare 后面的 HTTPS 上游：必须发 SNI，否则 TLS 握手拿不到正确证书
        proxy_ssl_server_name on;
        proxy_ssl_name        api.theobuild.top;

        # 必须指定 Host，否则 Cloudflare 无法按域名路由到正确源站
        proxy_set_header Host              api.theobuild.top;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 清空 Connection，交给 Nginx 自行管理与上游的长连接
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        # 同时兼容 SSE 长连接（/api/v1/sse/connect），避免 60s 默认超时被掐断
        proxy_read_timeout    3600s;

        # SSE 需要关闭缓冲，否则事件会被 Nginx 攒着不下发
        proxy_buffering off;
        proxy_cache     off;

        # 后端返回的 Location 头不做改写（保持后端原始地址）
        proxy_redirect off;
    }

    # 若前端也接在 Cloudflare 后面，可开启以下两行还原访客真实 IP
    #（需配合 ngx_http_realip_module，且 IP 段以 Cloudflare 官方文档为准）
    # set_real_ip_from 0.0.0.0/0;
    # real_ip_header CF-Connecting-IP;
}
