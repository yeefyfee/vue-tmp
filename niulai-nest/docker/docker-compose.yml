# 牛来后台管理系统(Nest.js) 本地依赖服务
# 使用方法：在 docker 目录下执行 docker compose up -d
# 说明：Nest 后端使用 MySQL + TypeORM + Redis + MinIO，不使用 MongoDB
#
# ⚠️ 本机【已经有】MySQL / Redis 时不要启动本文件：
#   - 本文件映射 3306 / 6379，与已有容器必然端口冲突，两者不能同时启动
#   - 直接复用已有实例即可，只要 .env.dev 的 MYSQL_DB / MYSQL_PASSWORD /
#     REDIS_PASSWORD / REDIS_DB 与那个实例的实际配置一致
#   - 先查现有容器与端口：
#       docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}}'
#       docker exec <mysql容器> mysql -uroot -p<密码> -e "show databases;"
#   - 只有在「依赖服务已存在」的服务器上部署应用时，才用上一级的
#     docker-compose.app-only.yml（仅起 app，连接外部数据库）
#
# ⚠️ 挂载的 ../sql/mysql/*.sql 含 24 条 DROP TABLE IF EXISTS，是破坏性脚本：
#   仅对空数据目录安全。往已有数据的库导入会清空 24 张表。

networks:
  niulai-nest:
    driver: bridge

services:
  # MySQL 数据库（对应 .env.dev 中的 MYSQL_* 配置）
  mysql:
    image: mysql:8.0
    container_name: niulai-nest-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      - TZ=Asia/Shanghai
      # 与 .env.dev 的 MYSQL_PASSWORD 保持一致
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=niulai_admin
    volumes:
      - ./mysql/data:/var/lib/mysql
      # 首次启动时自动导入建库建表脚本（仅数据目录为空时执行）
      - ../sql/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - 3306:3306
    networks:
      - niulai-nest
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Redis 缓存
  # 密码需与 .env.dev 的 REDIS_PASSWORD 保持一致
  redis:
    image: redis:7.2.3
    container_name: niulai-nest-redis
    restart: unless-stopped
    command: redis-server --requirepass 123456 --appendonly no
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./redis/data:/data
    ports:
      - 6379:6379
    networks:
      - niulai-nest

  # MinIO 对象存储
  # 账号需与 .env.dev 的 OSS_MINIO_* 配置保持一致
  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: niulai-nest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - TZ=Asia/Shanghai
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - niulai-nest
